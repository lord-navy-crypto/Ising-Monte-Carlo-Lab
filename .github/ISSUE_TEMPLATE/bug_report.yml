name: Bug report
description: Report a reproducible software, numerical, or display problem.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include dimension, lattice size, method, temperature, seed, and other relevant settings.
      placeholder: |
        1. Open ...
        2. Set N=...
        3. Choose ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lab version
      placeholder: 1.1.3
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.14.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS / Windows / Linux
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
